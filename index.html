<!DOCTYPE html>

    <!-- 开场动画：一段时间内只播一次（默认 24 小时） -->
    <script>
        (function () {
            var key = 'dgt:intro:last';
            var ttl = 24 * 60 * 60 * 1000;
            window.DGT_INTRO = { key: key, ttl: ttl, skip: false };
            try {
                var last = parseInt(localStorage.getItem(key) || '0', 10);
                if (last && Date.now() - last < ttl) {
                    document.documentElement.className += ' intro-skip';
                    window.DGT_INTRO.skip = true;
                }
            } catch (e) {
                /* 隐私模式下读不到 storage 就按“播放”处理 */
            }
        })();
    </script>

    <!-- 样式 -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/layout.css">
