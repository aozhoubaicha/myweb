<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片地图示例</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 600px; width: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 初始化地图，中心设为北京，缩放级别13
        var map = L.map('map').setView([39.9042, 116.4074], 13);

        // 添加OpenStreetMap底图
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // 示例图片1：覆盖故宫区域
        var imageUrl1 = 'https://backend.wplace.live/files/s0/tiles/1686/775.png';
        var imageBounds1 = [[39.909, 116.367], [40.044, 116.543]];
        L.imageOverlay(imageUrl1, imageBounds1).addTo(map);

        // 示例图片2：覆盖天安门区域
        var imageUrl2 = 'https://backend.wplace.live/files/s0/tiles/1686/776.png';
        var imageBounds2 = [[39.900, 116.390], [39.910, 116.410]];
        L.imageOverlay(imageUrl2, imageBounds2).addTo(map);
    </script>
</body>
</html>
